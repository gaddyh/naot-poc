[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naot-poc"
version = "0.1.0"
description = "Barcode scanning proof of concept using zxing-cpp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaddy" }]
dependencies = [
    "zxing-cpp>=2.2.0",
    "Pillow>=10.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
naot-scan = "naot_poc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naot_poc = ["py.typed"]
