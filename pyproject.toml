[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naot-poc"
version = "0.1.0"
description = "Barcode scanning proof of concept using zxing-cpp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaddy" }]
dependencies = [
    "zxing-cpp>=2.2.0",
    "Pillow>=10.0.0",
    "langgraph>=0.2.0",
    "langsmith>=0.10.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]
gemini = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
naot-scan = "naot_poc.__main__:main"
naot-eval = "naot_poc.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
naot_poc = ["py.typed", "evaluation/datasets/*.json"]
